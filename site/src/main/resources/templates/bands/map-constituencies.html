<!DOCTYPE html>
<html lang="en" layout:decorate="~{layout-map}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="@{#{page.band-map.title} + ' - Brass Band Results'}">Band Map - Brass Band Results</title>
</head>
<body>
<div layout:fragment="content">
    <h2 th:text="#{page.band-map.title}">Band Map</h2>

    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link" href="/bands/MAP" th:text="#{page.band-map.tab.rehearsal-day}">By Rehearsal Day</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" href="/bands/MAP/consituencies" th:text="#{page.band-map.tab.constituencies}">Constituencies</a>
        </li>
    </ul>
    <br/>

    <div class="tab-content">
        <div id="map" style="width: 100%; height: 800px"></div>
        <br/>
        <p th:text="#{page.band-map.constituencies.prompt}">This map shows all non-extinct bands in any UK region alongside current parliamentary boundaries.</p>
    </div>
</div>

<div layout:fragment="scriptfooter">
    <script>
        function pointToLayer(feature, latlng) {
            let marker =  L.marker(latlng, {
                icon: icon_markers.get(feature.properties.type)
            });
            return marker;
        }

        function populateBandsOnMap(data, bandsLayer){
            bandsLayer.addData(data);
        }

        let latitude = "53.703211";
        let longitude = "-1.511536";
        let mapZoom = "7";
        let map = L.map('map').setView([latitude, longitude], mapZoom);
        let icon_markers = buildIcons();
        let layers = {};

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        layers["boundaries"] = L.geoJson(null, {
            style: {
                color: "#ff7800",
                weight: 1,
                opacity: 0.65
            },
            onEachFeature: function(feature, layer) {
                if (feature.properties && feature.properties.PCON24NM) {
                    layer.bindPopup(feature.properties.PCON24NM);
                }
            }
        }).addTo(map);

        layers["bands"] = L.geoJson(null, {
            onEachFeature: onEachFeature,
            pointToLayer: pointToLayer
        }).addTo(map);

        let boundariesUrl = 'https://services1.arcgis.com/ESMARspQHYMw9BZ9/arcgis/rest/services/Westminster_Parliamentary_Constituencies_July_2024_Boundaries_UK_BGC/FeatureServer/0/query?where=1%3D1&outFields=PCON24NM&outSR=4326&f=geojson';
        fetch(boundariesUrl)
            .then(response => response.json())
            .then(json => layers["boundaries"].addData(json));

        let bandsUrl = '/bands/MAP/consituencies/bands.json';
        fetch(bandsUrl)
            .then(response => response.json())
            .then(json => populateBandsOnMap(json, layers["bands"]));

    </script>
</div>
</body>
</html>
